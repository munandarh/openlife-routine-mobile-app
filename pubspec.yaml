name: openlife_routine
description: Privacy-first, offline-first daily routine reminder app built with Flutter.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  audioplayers: ^6.7.1
  cupertino_icons: ^1.0.8
  drift: ^2.34.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  timezone: ^0.11.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  # Listed file by file rather than as a directory: registering the folder
  # bundled the unused v2.0 family-care artwork too (~3.7 MB of the APK).
  assets:
    - assets/audio/
    - assets/vector/onboarding_build_better_days.png
    - assets/vector/onboarding_smart_routines.png
    - assets/vector/onboarding_private_by_default.png
    - assets/vector/onboarding_starter_template.png
    - assets/vector/today_notification_bell.png
    - assets/vector/today_sleep_routine.png
    - assets/vector/today_water_hydration.png
    - assets/vector/today_vitamin_routine.png
    - assets/vector/today_daily_celebration.png
    - assets/vector/today_insights_workspace.png

  # Bundled rather than fetched: the app is offline-first, and the theme's
  # type is Nunito. Before this, `fontFamily: 'Plus Jakarta Sans'` named a
  # family that was never shipped, so every screen silently rendered Roboto.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
